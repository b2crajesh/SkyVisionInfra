version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sky-vision-infra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyvision
      POSTGRES_PASSWORD: skyvision_dev_password
      POSTGRES_DB: skyvision
    ports:
      - "5433:5432"
    volumes:
      - skyvision_pgdata:/var/lib/postgresql/data

volumes:
  skyvision_pgdata:
